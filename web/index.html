<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrbitalSAR Reflex — Mission HUD Prototype</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --border: #1e293b;
      --accent: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ok: #10b981;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
    header {
      display: flex; align-items: center; gap: 18px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 20px;
    }
    header img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; }
    h1 { margin: 0 0 4px; font-size: 1.45rem; }
    .sub { color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
    }
    label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 12px; color: var(--muted); }
    input[type="range"] { width: 100%; margin-top: 6px; accent-color: var(--accent); }
    .badge {
      display: inline-block; padding: 6px 12px; border-radius: 999px;
      font-weight: 700; font-size: 0.85rem; letter-spacing: 0.04em;
    }
    .hex {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #020617; border: 1px solid var(--border);
      padding: 12px; border-radius: 8px; word-break: break-all;
      font-size: 0.85rem; color: var(--accent); margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="../assets/orbitalsar_reflex_mission_patch.jpg" alt="OrbitalSAR Reflex Patch" />
      <div>
        <h1>OrbitalSAR Reflex — Edge SAR Telemetry HUD</h1>
        <div class="sub">NASA Space Apps Challenge 2026 · Dancing with the SARs · Volkan Dagli, Murat Emre ÖZKAYA, Prenses Metin</div>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h3>SAR Scene Parameters</h3>
        <label>Pre-Event σ⁰ <span id="preVal">0.12</span></label>
        <input id="pre" type="range" min="0.01" max="0.50" step="0.01" value="0.12" />

        <label>Post-Event σ⁰ <span id="postVal">0.03</span></label>
        <input id="post" type="range" min="0.01" max="0.50" step="0.01" value="0.03" />

        <label>Coherence Drop (Δγ) <span id="cohVal">0.62</span></label>
        <input id="coh" type="range" min="0.00" max="1.00" step="0.01" value="0.62" />
      </div>

      <div class="card">
        <h3>Autonomous Reflex Output</h3>
        <div id="badge" class="badge">FLOOD_INUNDATION</div>
        <p id="metrics" class="sub"></p>
        <div class="sub">24-Byte FNS Packet Preview (Hex):</div>
        <div id="hex" class="hex"></div>
      </div>
    </div>
  </div>

  <script>
    const preEl = document.getElementById("pre");
    const postEl = document.getElementById("post");
    const cohEl = document.getElementById("coh");

    function update() {
      const pre = parseFloat(preEl.value);
      const post = parseFloat(postEl.value);
      const coh = parseFloat(cohEl.value);
      document.getElementById("preVal").textContent = pre.toFixed(2);
      document.getElementById("postVal").textContent = post.toFixed(2);
      document.getElementById("cohVal").textContent = coh.toFixed(2);

      const db = 10 * Math.log10(post / pre);
      let label = "NOMINAL", code = 0, color = "#10b981";
      if (db <= -3.0 && coh >= 0.35) { label = "FLOOD_INUNDATION"; code = 1; color = "#38bdf8"; }
      else if (db >= 3.0 && coh >= 0.45) { label = "STRUCTURAL_DAMAGE"; code = 3; color = "#ef4444"; }
      else if (coh >= 0.35) { label = "SURFACE_DEFORMATION"; code = 2; color = "#f59e0b"; }

      const sev = code === 0 ? 0 : Math.max(1, Math.min(255, Math.round((Math.min(1, Math.abs(db) / 10 * 0.5 + coh * 0.5)) * 255)));
      const badge = document.getElementById("badge");
      badge.textContent = label;
      badge.style.background = color + "22";
      badge.style.color = color;
      badge.style.border = "1px solid " + color;

      document.getElementById("metrics").textContent =
        `Δσ⁰ = ${db.toFixed(2)} dB · Δγ = ${coh.toFixed(2)} · Severity = ${sev}/255`;

      const buf = new ArrayBuffer(24);
      const view = new DataView(buf);
      view.setUint32(0, Math.floor(Date.now() / 1000), true);
      view.setFloat32(4, 36.8121, true);
      view.setFloat32(8, 34.6415, true);
      view.setFloat32(12, db, true);
      view.setFloat32(16, coh, true);
      view.setUint8(20, code);
      view.setUint8(21, sev);
      view.setUint16(22, 0xCAFE, true);
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join(" ");
      document.getElementById("hex").textContent = hex;
    }

    [preEl, postEl, cohEl].forEach(el => el.addEventListener("input", update));
    update();
  </script>
</body>
</html>
